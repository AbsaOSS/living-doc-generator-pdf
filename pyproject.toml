[project]
name = "living-doc-generator-pdf"
version = "0.1.0"
description = "Render a canonical source JSON file into a PDF using Jinja2 templates and WeasyPrint."
requires-python = ">=3.10"

[tool.black]
line-length = 120
target-version = ['py310']
force-exclude = '''test'''

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["generator", "main"]
omit = ["tests/*"]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = "tests"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pylint.main]
py-version = "3.10"
