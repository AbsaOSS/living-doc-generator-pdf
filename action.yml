name: 'Living Doc Generator PDF'
description: 'Generate professional PDF documentation from canonical JSON using Jinja templates and WeasyPrint'
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  source-path:
    description: 'Path to the canonical source JSON file to render'
    required: true
  template-path:
    description: 'Directory containing custom Jinja templates (overrides or extends a built-in set)'
    required: false
  document-type:
    description: 'Built-in template set to use: user-stories | ui-test-catalog | coverage-matrix'
    required: false
  output-path:
    description: 'Path for the generated PDF file'
    required: false
    default: 'output.pdf'
  document-title:
    description: 'Title shown on the cover page (defaults to the document type or source file name)'
    required: false
  schema-path:
    description: 'Optional JSON Schema path; when set, the source JSON is validated before rendering'
    required: false
  debug-html:
    description: 'Save intermediate HTML as rendered.html'
    required: false
    default: 'false'
  verbose:
    description: 'Enable verbose logging'
    required: false
    default: 'false'
  pdf_ready_json:
    description: 'Deprecated alias for source-path; use source-path instead'
    required: false

outputs:
  pdf_path:
    description: 'Absolute path to generated PDF file'
    value: ${{ steps.run-generator.outputs.pdf-path }}
  html_path:
    description: 'Absolute path to debug HTML (if debug-html=true)'
    value: ${{ steps.run-generator.outputs.html-path }}
  report_path:
    description: 'Absolute path to pdf_report.json'
    value: ${{ steps.run-generator.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install WeasyPrint system dependencies
      run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2
      shell: bash

    - name: Install Python dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Run PDF generator
      id: run-generator
      run: python ${{ github.action_path }}/main.py
      shell: bash
      env:
        INPUT_SOURCE_PATH: ${{ inputs.source-path }}
        INPUT_TEMPLATE_PATH: ${{ inputs.template-path }}
        INPUT_DOCUMENT_TYPE: ${{ inputs.document-type }}
        INPUT_OUTPUT_PATH: ${{ inputs.output-path }}
        INPUT_DOCUMENT_TITLE: ${{ inputs.document-title }}
        INPUT_SCHEMA_PATH: ${{ inputs.schema-path }}
        INPUT_DEBUG_HTML: ${{ inputs.debug-html }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_PDF_READY_JSON: ${{ inputs.pdf_ready_json }}
