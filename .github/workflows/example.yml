name: Example PDF Generation

on:
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    name: Generate Example PDF
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Generate PDF from minimal example
        id: generate
        uses: ./
        with:
          pdf_ready_json: examples/minimal_valid.json
          debug_html: 'true'

      - name: Print action outputs
        run: |
          echo "PDF path: ${{ steps.generate.outputs.pdf_path }}"
          echo "HTML path: ${{ steps.generate.outputs.html_path }}"
          echo "Report path: ${{ steps.generate.outputs.report_path }}"

      - name: Upload generated PDF
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: example-pdf
          path: |
            ${{ steps.generate.outputs.pdf_path }}
            ${{ steps.generate.outputs.html_path }}
            ${{ steps.generate.outputs.report_path }}
