name: Build and Test
on:
  pull_request:
    branches:
      - master
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-code-analysis:
    runs-on: ubuntu-latest
    name: Pylint Static Code Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Analyze code with Pylint
        id: analyze-code
        run: |
          pylint_score=$(pylint $(git ls-files '*.py')| grep 'rated at' | awk '{print $7}' | cut -d'/' -f1)
          if [ -z "$pylint_score" ]; then
            echo "Failed to extract Pylint score"
            exit 1
          fi
          echo "score=$pylint_score" >> "$GITHUB_OUTPUT"

      - name: Check Pylint score
        run: |
          score="${{ steps.analyze-code.outputs.score }}"
          echo "Pylint score is $score"

          if (( $(echo "$score < 9.5" | bc -l) )); then
            echo "Failure: Pylint score is below 9.5 (project score: $score)."
            exit 1
          else
            echo "Success: Pylint score is above 9.5 (project score: $score)."
          fi

  code-format-check:
    runs-on: ubuntu-latest
    name: Black Format Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check code format with Black
        id: check-format
        run: |
          black --check $(git ls-files '*.py')

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set PYTHONPATH environment variable
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Check code coverage with Pytest
        run: python -m pytest --cov=generator --cov=main -v tests/unit --cov-fail-under=80 --cov-report=html --cov-report=term

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  mypy-check:
    runs-on: ubuntu-latest
    name: Mypy Type Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Check types with Mypy
        id: check-types
        run: |
          mypy .

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Set PYTHONPATH environment variable
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v

      - name: Generate example PDFs from integration tests
        if: always()
        run: |
          mkdir -p test-outputs
          # Generate PDFs from example files
          python -c "
          from pathlib import Path
          from generator.schema_validator import load_source
          from generator.template_renderer import TemplateRenderer
          from generator.pdf_generator import PdfGenerator

          examples_dir = Path('examples')
          output_dir = Path('test-outputs')
          output_dir.mkdir(exist_ok=True)
          template_dir = str(Path('generator/templates'))

          for json_file in ['minimal_valid.json', 'full_example.json', 'multiple_stories.json']:
              try:
                  json_path = examples_dir / json_file
                  pdf_data = load_source(str(json_path))
                  renderer = TemplateRenderer(None)
                  html = renderer.render(pdf_data)
                  output_pdf = output_dir / json_file.replace('.json', '.pdf')
                  generator = PdfGenerator()
                  generator.generate_pdf(html, str(output_pdf), template_dir)
                  print(f'Generated: {output_pdf}')
              except Exception as e:
                  print(f'Failed to generate {json_file}: {e}')
          "

      - name: Upload example PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: example-pdfs
          path: test-outputs/*.pdf
          retention-days: 30
